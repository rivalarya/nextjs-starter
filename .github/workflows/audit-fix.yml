name: Audit Fix

on:
  schedule:
    # Weekly, Monday 00:00 UTC
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  audit-fix:
    name: Audit Fix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.28.8

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Run pnpm audit fix
        run: pnpm audit --fix
        continue-on-error: true

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/audit-fix
          commit-message: "fix: pnpm audit fix"
          title: "fix: pnpm audit fix"
